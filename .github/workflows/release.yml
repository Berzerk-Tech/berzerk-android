# Release oficial: tag `vX.Y.Z` (= VERSION_NAME em gradle.properties) → APK
# assinado com o keystore dos secrets do repo + `latest.json` no GitHub Release.
# O Nexus lê o latest.json em `GET /android/release` e o app baixa o APK daqui.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Tag bate com VERSION_NAME
        run: |
          VERSAO=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          test "v$VERSAO" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME ≠ VERSION_NAME $VERSAO"; exit 1; }
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"

      - name: Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build assinado + testes
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease testReleaseUnitTest --no-daemon

      - name: latest.json
        run: |
          APK=app/build/outputs/apk/release/berzerk-coletor-$VERSAO.apk
          test -f "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          IFS=. read -r MA MI PA <<< "$VERSAO"
          CODE=$((MA * 10000 + MI * 100 + PA))
          NOTAS=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" | sed 's/"/\\"/g' | tr '\n' ' ' | sed 's/ *$//')
          cat > latest.json <<JSON
          {
            "version": "$VERSAO",
            "versionCode": $CODE,
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "$NOTAS",
            "apk": {
              "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/berzerk-coletor-$VERSAO.apk",
              "sha256": "$SHA"
            }
          }
          JSON
          cat latest.json

      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: Berzerk Coletor v${{ env.VERSAO }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/berzerk-coletor-${{ env.VERSAO }}.apk
            latest.json
